[package]
name = "spike"
version = "0.1.0"
edition = "2021"
publish = false

# Throwaway diagnostic tool for Milestone 1. Answers the untested assumptions in
# PLAN.md section 6 before any real code gets written. Not the product.

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
] }
